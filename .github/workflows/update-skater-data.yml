name: Update Skater Results

on:
  push:
    paths:
      - 'data/competitions.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch Results & Update Static Data
        run: |
          python scripts/fetch_web_results.py --all

      - name: Commit and push if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skater-data.json results/*.pdf
          if git diff --staged --quiet; then
            echo "No changes in skater results detected."
          else
            git commit -m "Auto-update Joanne figure skating results [skip ci]"
            git push
          fi
